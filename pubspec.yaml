name: cave_paper
description: An open-source, offline PDF reading workspace for desktop and mobile.
publish_to: none
version: 0.1.0-beta.1+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.0.0
  pdfrx: 2.12.0
  file_selector: 1.0.4
  path_provider: 2.1.5
  crypto: 3.0.7
  path: 1.9.1
  share_plus: 13.3.0
  printing: 5.15.1
  pdf: 3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sample.pdf
    - assets/notices/
    - assets/notices/native-macos-arm64/
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
